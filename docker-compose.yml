services:

  postgres:
    image: postgres:18
    container_name: paycore-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore_dev_password

    ports:
      - "5432:5432"

    volumes:
      - paycore_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycore -d paycore"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:8
    container_name: paycore-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - paycore_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:

  paycore_postgres_data:
    name: paycore-postgres-data

  paycore_redis_data:
    name: paycore-redis-data